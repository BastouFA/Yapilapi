name: Deploy

# development: every push to main. staging: manual. production: manual, after staging, behind the GitHub
# "production" environment (configure required reviewers there). Secrets are per-environment, never in the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, staging, production]
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          {
            registry: ghcr.io,
            username: '${{ github.actor }}',
            password: '${{ secrets.GITHUB_TOKEN }}',
          }
      - uses: docker/setup-buildx-action@v4
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/api:${{ steps.meta.outputs.tag }}
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          build-args: |
            APP=web
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/web:${{ steps.meta.outputs.tag }}
      - name: admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          build-args: |
            APP=admin
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/admin:${{ steps.meta.outputs.tag }}

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'development' }}
    needs: images
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Write SSH key
        run: |
          umask 077
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
          mkdir -p ~/.ssh && ssh-keyscan -H "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
          TAG: ${{ needs.images.outputs.tag }}
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          SMOKE_URL: ${{ vars.API_PUBLIC_URL }}
        run: infrastructure/deployment/deploy.sh
