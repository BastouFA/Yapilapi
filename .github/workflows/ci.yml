name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yapilapi
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapilapi
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapilapi_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Migrate
        run: pnpm db:migrate
      - name: Unit, integration, API, security and AI tests
        run: pnpm test
      - name: Build
        run: pnpm build

  accessibility:
    # axe-core (WCAG 2.2 A/AA + best practices) on the main pages in light/dark at
    # phone and desktop widths, plus keyboard checks. See docs/accessibility.md.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yapilapi_a11y
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/yapilapi_a11y
      NEXT_TELEMETRY_DISABLED: '1'
      API_INTERNAL_URL: http://127.0.0.1:4000
      NEXT_PUBLIC_WS_URL: ws://127.0.0.1:4000/v1/realtime
      A11Y_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - name: Install Chromium
        run: pnpm --filter @yapilapi/web exec playwright install --with-deps chromium
      - name: Build web
        run: pnpm --filter @yapilapi/web build
      - name: Start API and web
        run: |
          APP_ENV=test API_HOST=127.0.0.1 RATE_LIMIT_MAX=100000 WEB_ORIGIN=http://localhost:3000 \
            pnpm --filter @yapilapi/api start > api.log 2>&1 &
          pnpm --filter @yapilapi/web start > web.log 2>&1 &
          for url in http://127.0.0.1:4000/health/ready http://localhost:3000/login; do
            for i in $(seq 1 60); do curl -fs "$url" > /dev/null && break; sleep 2; done
            curl -fs "$url" > /dev/null
          done
      - name: Accessibility and keyboard tests
        run: pnpm --filter @yapilapi/web test:a11y
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: |
            apps/web/e2e/.report
            apps/web/e2e/.results
            api.log
            web.log

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Static analysis
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
