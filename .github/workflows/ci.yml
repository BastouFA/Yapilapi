name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Unit + integration tests (real Postgres and Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yapilapi
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yapilapi" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yapilapi:ci_only_password@127.0.0.1:5432/yapilapi_test_ci
      REDIS_URL: redis://127.0.0.1:6379
      # tests/ai-evals/run.ts manages its own throwaway database and otherwise defaults to
      # postgres://yapilapi:yapilapi_dev_password@..., a different password (the local dev / e2e-job
      # convention) than this job's Postgres service actually uses. Without this, "npm run test:ai-evals"
      # fails with "password authentication failed for user \"yapilapi\"" once the DB-creation step above
      # lets the job reach it.
      AI_EVALS_DATABASE_URL: postgres://yapilapi:ci_only_password@127.0.0.1:5432/yapilapi_test_aievals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: Create and migrate the CI test database
        # The test harness (apps/api/test/helpers.ts and friends) expects TEST_DATABASE_URL to already point at
        # an existing, migrated database. The postgres:16 service above only gives us the server - nothing
        # creates "yapilapi_test_ci" or runs migrations against it, so every test that touches the DB failed with
        # "database \"yapilapi_test_ci\" does not exist". loadConfig() only requires DATABASE_URL, so pointing it
        # at the same connection string as TEST_DATABASE_URL is enough for the migration script.
        env:
          DATABASE_URL: postgres://yapilapi:ci_only_password@127.0.0.1:5432/yapilapi_test_ci
        run: |
          PGPASSWORD=ci_only_password psql -h 127.0.0.1 -U yapilapi -d postgres -c "CREATE DATABASE yapilapi_test_ci;"
          npm run db:migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - name: AI evaluation suite (deterministic dev provider)
        run: npm run test:ai-evals
      - name: OpenAPI document is up to date
        run: |
          npm run openapi
          git diff --exit-code docs/api/openapi.json

  web-admin:
    name: Web + admin build and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm test -w @yapilapi/web
      - run: npm test -w @yapilapi/admin
      - run: npm run build -w @yapilapi/web
      - run: npm run build -w @yapilapi/admin

  mobile:
    name: Mobile (Expo) typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      # apps/mobile is deliberately not an npm workspace (see docs/architecture/decisions/001-mobile-monorepo.md),
      # but its Jest config maps @yapilapi/api-client and @yapilapi/design-system straight to their TS source in
      # packages/*/src, which Babel transpiles using @babel/runtime helpers. That package only resolves from an
      # ancestor node_modules of packages/*, which only exists once the root workspace is installed - without this
      # step every mobile test suite that (transitively) imports one of those packages fails with
      # "Cannot find module '@babel/runtime/helpers/interopRequireDefault'".
      - run: npm ci
      - run: npm ci --prefix apps/mobile
      - run: npm run mobile:typecheck
      - run: npm run mobile:test

  e2e:
    name: Web end-to-end + accessibility (Playwright)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: yapilapi
          POSTGRES_PASSWORD: yapilapi_dev_password
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yapilapi" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    # The e2e harness creates and resets its own private database (yapilapi_test_web) on this throwaway service.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @yapilapi/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      # Production dependencies must have no high/critical advisories. Dev-only advisories are reported, not blocking.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high || echo "::warning::dev-dependency advisories present"
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
