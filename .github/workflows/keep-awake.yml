name: Keep the API awake

# Render's free plan puts a service to sleep after 15 minutes without requests, and the next visitor
# then waits about a minute. The website is on Vercel (it never sleeps); this pings the API every
# 5 minutes so it stays up too. One always-on free service fits Render's 750 free hours a month;
# don't point this at a second Render service. GitHub may run scheduled jobs a few minutes late.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API
        run: curl -fsS --max-time 120 -o /dev/null -w "api %{http_code} in %{time_total}s\n" https://api.yapilapi.com/health/live || true
