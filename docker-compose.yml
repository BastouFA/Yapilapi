# This runs Postgres + Redis for YAPILAPI
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yapilapi
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yapilapi']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for media (any S3 provider works in production).
  storage:
    image: chrislusf/seaweedfs:latest
    command: 'server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0'
    ports: ['8333:8333']
    volumes: [media:/data]

  # Live video: RTMP ingest (OBS etc.) and HLS playback, authorized by the API.
  live:
    image: bluenviron/mediamtx:latest
    volumes: ['./infrastructure/media/mediamtx.yml:/mediamtx.yml:ro', './infrastructure/media/recordings:/recordings']
    ports: ['1935:1935', '8888:8888', '8889:8889', '127.0.0.1:9997:9997']
    extra_hosts: ['host.docker.internal:host-gateway']

  # TURN relay for calls on networks that block peer-to-peer traffic.
  turn:
    image: coturn/coturn:latest
    command: ['-c', '/etc/coturn/turnserver.conf']
    volumes: ['./infrastructure/media/turnserver.conf:/etc/coturn/turnserver.conf:ro']
    ports: ['3478:3478/udp', '3478:3478/tcp', '51160-51200:51160-51200/udp']

  # Distributed tracing (opt-in): `docker compose --profile tracing up -d jaeger`,
  # then run the API with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  # Jaeger receives OTLP directly; the UI is on http://localhost:16686.
  jaeger:
    profiles: ['tracing']
    image: jaegertracing/jaeger:2.21.0
    ports: ['4318:4318', '16686:16686']

volumes:
  pgdata:
  media:
