# This runs Postgres + Redis for YAPILAPI
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yapilapi
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yapilapi']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage for media (any S3 provider works in production).
  storage:
    image: chrislusf/seaweedfs:latest
    command: 'server -s3 -s3.port=8333 -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0'
    ports: ['8333:8333']
    volumes: [media:/data]

volumes:
  pgdata:
  media:
