packages:
  - 'apps/*'
  # The Expo app installs on its own (see apps/mobile/README.md) to keep web/API installs light.
  - '!apps/mobile'
  - 'packages/*'
allowBuilds:
  esbuild: true
  sharp: true
  ffmpeg-static: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1140.0'
  - '@aws-sdk/s3-request-presigner@3.1140.0'
  - '@simplewebauthn/server@14.0.3'
