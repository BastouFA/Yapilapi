# Minimal Prometheus scrape config. The API exposes /metrics; in staging/production it REQUIRES METRICS_TOKEN.
global:
  scrape_interval: 15s
rule_files: [alerts.yml]
scrape_configs:
  - job_name: yapilapi-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['api:4000']
  - job_name: yapilapi-readiness
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets: ['http://api:4000/health/ready']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115
