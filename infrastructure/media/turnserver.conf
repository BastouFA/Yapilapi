# coturn for WebRTC calls behind strict NATs. Credentials are time-limited
# HMAC tokens issued by the API (TURN REST API), so no user list lives here.
listening-port=3478
realm=yapilapi.local
use-auth-secret
static-auth-secret=dev-turn-secret
fingerprint
no-cli
min-port=51160
max-port=51200
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
