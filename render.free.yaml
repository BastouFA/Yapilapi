# Render Blueprint for YAPILAPI on Render's free plans (https://render.com/docs/free).
#
# Same services and settings as render.yaml, at no cost, for trying YAPILAPI before paying for hosting.
# Apply it from the Render Dashboard: New > Blueprint > connect github.com/BastouFA/Yapilapi, and set
# **Blueprint Path** to `render.free.yaml`. Walkthrough: docs/operations/deploy-render.md ("Free start").
#
# What free means here, and when to move to render.yaml:
# - The API and web app sleep after 15 minutes without visits; the next visit wakes them in about a
#   minute. While asleep, background jobs (video processing, scheduled posts) wait.
# - Free Postgres is deleted 30 days after it is created, with no backups. Move to render.yaml (paid
#   database) before anyone you don't want to lose signs up.
# - Free services can't use the pre-deploy step or the Shell tab: the API applies migrations when it
#   starts (MIGRATE_ON_START, set in the image), and the launch check runs from your own computer.
# - Free services can't send email on ports 25, 465 or 587: use port 2465 (Resend supports it).
# - Free Key Value keeps everything in memory only; it holds nothing that can't be rebuilt.
#
# Settings marked `sync: false` are the ones you paste into the Dashboard the first time you apply this
# file. The API refuses to start in production without the required ones, with a clear message in the log.

databases:
  - name: yapilapi-db
    databaseName: yapilapi
    user: yapilapi
    plan: free
    postgresMajorVersion: '16'
    region: frankfurt

services:
  - type: keyvalue
    name: yapilapi-cache
    plan: free
    region: frankfurt
    # Rate limits and realtime fan-out tolerate losing keys, so evict rather than refuse writes.
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private network only

  - type: web
    name: yapilapi-api
    # The API's own address (realtime sockets go here); Cloudflare's DNS points api at this service.
    domains:
      - api.yapilapi.com
    runtime: docker
    dockerfilePath: infrastructure/docker/api.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    # Free services have no pre-deploy step: the API applies migrations when it starts (MIGRATE_ON_START in the image).
    # Answers 200 only once the database answers, so a new version gets traffic only when it can serve it.
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: API_PORT
        value: '10000'
      # The first is used in links (emails, checkout); the others may also call the API.
      - key: WEB_ORIGIN
        value: https://yapilapi.com,https://www.yapilapi.com,https://yapilapi-web.onrender.com
      # Media addresses go through the web app's /media proxy, so photos and videos are same-origin.
      - key: PUBLIC_API_URL
        value: https://yapilapi.com
      - key: WEBAUTHN_RP_ID
        value: yapilapi.com
      - key: WEBAUTHN_ORIGIN
        value: https://yapilapi.com
      - key: DATABASE_URL
        fromDatabase:
          name: yapilapi-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: yapilapi-cache
          type: keyvalue
          property: connectionString

      # Generated once by Render and kept. Never change MFA_ENCRYPTION_KEY: it decrypts two-step codes.
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: PAYMENTS_WEBHOOK_SECRET
        generateValue: true
      # Signs Mini App tokens, and authorizes the live video server once you run one.
      - key: LIVE_HOOK_SECRET
        generateValue: true
      # Lets a monitoring service read /metrics (Authorization: Bearer <value>); without it /metrics isn't served.
      - key: METRICS_TOKEN
        generateValue: true
      # Signs the QR codes on event tickets. Changing it makes every ticket's code show "not valid" until the wallet reloads.
      - key: TICKET_TOKEN_SECRET
        generateValue: true

      # Payments (required). Stripe test-mode keys (sk_test_…, pk_test_…) work until you are ready to take real money.
      - key: PAYMENTS_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      # The webhook's signing secret (whsec_…). Type "pending" on the first apply; the checklist sets it after.
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Optional: mobile money and local cards (NGN, GHS, KES, ZAR) through Paystack. Both keys or neither.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false

      # Email (required): verification, password reset, security notices. Any SMTP relay,
      # e.g. smtps://resend:<api key>@smtp.resend.com:2465, and a sender on your verified domain.
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Photos and videos (required). S3-compatible storage (Cloudflare R2 recommended: no fees for
      # downloads). The bucket stays private: the API serves media itself. Without it, uploads would be
      # lost on every deploy.
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'

      # Optional: the AI helpers use Claude once a key is pasted here; while it is empty they use the
      # built-in stand-in (the API logs a warning) and automatic translation stays off. AI_MODEL can be added
      # to choose another model; AI_TRANSLATE_MODEL (default claude-sonnet-5-5) is the one for translations.
      - key: AI_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      # New automatic translations a day for everyone (about $1–2 per 1,000); raise it as the app grows.
      - key: AUTO_TRANSLATE_DAILY_LIMIT
        value: '5000'
      # Yapilapi Today scripts a day for everyone (about $0.01 each); raise it as the app grows.
      - key: TODAY_DAILY_LIMIT
        value: '500'

      # Optional: speech-to-text for automatic captions and voice message transcripts. Any
      # OpenAI-compatible service (Groq recommended: fast and cheap; OpenAI; a Whisper server).
      # Paste the key, then change TRANSCRIBE_PROVIDER to openai-compatible (docs/product/speech-engine.md).
      - key: TRANSCRIBE_PROVIDER
        value: none
      - key: TRANSCRIBE_API_URL
        value: https://api.groq.com/openai/v1
      - key: TRANSCRIBE_MODEL
        value: whisper-large-v3-turbo
      - key: TRANSCRIBE_API_KEY
        sync: false

      # Optional: text-to-speech for "Listen in French" under translated voice messages. Any
      # OpenAI-compatible POST /audio/speech (OpenAI gpt-4o-mini-tts or tts-1). Paste the key, then
      # change TTS_PROVIDER to openai-compatible. TTS_DAILY_CHAR_LIMIT caps the spend.
      - key: TTS_PROVIDER
        value: none
      - key: TTS_API_URL
        value: https://api.openai.com/v1
      - key: TTS_MODEL
        value: gpt-4o-mini-tts
      - key: TTS_VOICE
        value: alloy
      - key: TTS_DAILY_CHAR_LIMIT
        value: '200000'
      - key: TTS_API_KEY
        sync: false

      # Optional: confirming phone numbers by text (Twilio Verify). Without it, people confirm by email.
      # Paste the three values, then change SMS_PROVIDER to twilio.
      - key: SMS_PROVIDER
        value: dev
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false

      # Photo and video checks for nudity and violence. "none" until you add AWS Rekognition keys, then set
      # MEDIA_MODERATION_PROVIDER=rekognition. Recommended before opening sign-ups to the public.
      - key: MEDIA_MODERATION_PROVIDER
        value: none
      - key: REKOGNITION_REGION
        value: eu-central-1
      - key: REKOGNITION_ACCESS_KEY_ID
        sync: false
      - key: REKOGNITION_SECRET_ACCESS_KEY
        sync: false

      # Optional: browser push notifications. Generate the pair with `npx web-push generate-vapid-keys`;
      # VAPID_SUBJECT is a contact address push services can reach, e.g. mailto:support@yourdomain.com.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # Optional: music catalogue sources (docs/operations/music.md). Each is off until set.
      - key: JAMENDO_CLIENT_ID
        sync: false
      # A licensing partner's catalogue, once a deal is signed: both or neither. MUSIC_LICENSED_NAME can be
      # added to change the name the music picker shows.
      - key: MUSIC_LICENSED_API_URL
        sync: false
      - key: MUSIC_LICENSED_API_KEY
        sync: false

      # How the phone apps offer digital goods (docs/operations/in-app-purchases.md). Changing these
      # needs no new app release: the phone reads them from /v1/flags.
      - key: IOS_DIGITAL_PURCHASES
        value: hidden
      - key: IOS_EXTERNAL_LINK_COUNTRIES
        value: US
      - key: ANDROID_DIGITAL_PURCHASES
        value: play_billing_required
      - key: ANDROID_USER_CHOICE_COUNTRIES
        value: US

      # Not set here on purpose:
      # - JOB_WORKER: background jobs (video processing, scheduled posts, payouts) run inside the API;
      #   jobs are claimed with row locks, so adding instances later is safe.
      # - TRUST_PROXY: the default trusts Render's private-network proxy. See "Check the API sees real
      #   addresses" in docs/operations/deploy-render.md before changing it.
      # - Live video (LIVE_*) and calls relay (TURN_*): they need servers Render can't run (RTMP and UDP).
      #   See "Live video and the calls relay" in docs/operations/deploy-render.md.

  - type: web
    name: yapilapi-web
    domains:
      - yapilapi.com
      - www.yapilapi.com
    runtime: docker
    dockerfilePath: infrastructure/docker/web.Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /login
    # Render passes these to the Docker build as build arguments; the first three are built into the app.
    envVars:
      - key: NODE_ENV
        value: production
      # Where the web server sends /api and /media (the browser never calls the API host for those).
      - key: API_INTERNAL_URL
        value: https://yapilapi-api.onrender.com
      # The realtime socket, straight to the API (the page's security policy allows this origin).
      - key: NEXT_PUBLIC_WS_URL
        value: wss://api.yapilapi.com/v1/realtime
      - key: SITE_URL
        value: https://yapilapi.com
      # Shown on the legal pages (/legal), read when a page is requested. Set them before launch.
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_ADDRESS
        sync: false
      - key: LEGAL_JURISDICTION
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: PRIVACY_EMAIL
        sync: false
      - key: COPYRIGHT_EMAIL
        sync: false
      - key: SAFETY_EMAIL
        sync: false
      # Optional, once the phone apps exist: links on this site open the app when it's installed.
      # Your Apple team id (10 characters), and the SHA-256 fingerprints of the Android signing keys,
      # separated by commas. Read when a page is requested. docs/operations/real-device-testing.md.
      - key: APPLE_TEAM_ID
        sync: false
      - key: ANDROID_CERT_SHA256
        sync: false
